name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run the RAGAS evaluation (needs ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==0.16.7"
      - run: ruff check .
      - run: ruff format --check .

  test-python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[extraction,chunking,retrieval,eval,dev]"
      - run: pytest -q --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: pytest-report.xml

  test-sidecar:
    name: Defuddle sidecar tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/defuddle_sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/defuddle_sidecar/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate interpolation and service graph
        run: docker compose --env-file .env.example config --quiet
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          ignore: DL3008,DL3013

  compose-smoke:
    name: Stack smoke test (all services healthy)
    # Full stack bring-up is slow; run on main and manual dispatch, not on every PR.
    if: github.event_name != 'pull_request'
    needs: [test-python, test-sidecar, compose-config]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with throwaway secrets
        run: |
          cp .env.example .env
          for key in POSTGRES_PASSWORD REDIS_PASSWORD QDRANT_API_KEY N8N_ENCRYPTION_KEY SERVICE_JWT_SECRET; do
            sed -i "s|^${key}=change-me|${key}=$(openssl rand -hex 32)|" .env
          done
          # Placeholder provider keys: startup only checks presence, never calls out.
          sed -i 's|^ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=sk-ant-placeholder|; s|^COHERE_API_KEY=.*|COHERE_API_KEY=placeholder|; s|^OTEL_EXPORTER_OTLP_ENDPOINT=.*|OTEL_EXPORTER_OTLP_ENDPOINT=|' .env
      - name: Build and start (waits for every healthcheck)
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: Probe /health and /ready
        run: |
          set -euo pipefail
          for port in 8001 8002 8003; do
            curl -fsS "http://127.0.0.1:${port}/health"
            curl -fsS "http://127.0.0.1:${port}/ready"
            echo
          done
          curl -fsS http://127.0.0.1:5678/healthz && echo
          curl -fsS http://127.0.0.1:5679/healthz && echo
      - name: Service status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  ragas-eval:
    name: RAGAS evaluation gate
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    needs: [test-python]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[eval]"
      - name: Fail fast when the judge key is missing
        run: test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret is not set"; exit 1; }
      - name: Evaluate against thresholds
        run: python evaluation/run_ragas_eval.py --dataset evaluation/fixtures/eval_dataset.json --thresholds evaluation/thresholds.yaml --output evaluation/reports/ragas_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragas-report
          path: evaluation/reports/ragas_report.json
