[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "contextual-rag"
version = "0.1.0"
description = "Event-driven contextual RAG pipeline: extraction, Anthropic contextual chunking, Qdrant hybrid + ColBERT retrieval, Cohere reranking, RAGAS evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Shared runtime for every FastAPI service. Exact pins: reproducible images.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "redis==8.1.0",
  "PyJWT==2.14.0",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-instrumentation-httpx==0.65b0",
  "opentelemetry-instrumentation-redis==0.65b0",
]

[project.optional-dependencies]
extraction = [
  "trafilatura==2.2.0",
  "lxml[html_clean]==6.1.3",
  "lxml_html_clean==0.4.5",
  "python-multipart==0.0.32",
]
chunking = [
  "anthropic==1.6.0",
  "qdrant-client==1.19.1",   # satisfies the >=1.17.0 floor; RrfQuery/Rrf verified here
  "fastembed==0.8.0",
]
retrieval = [
  "cohere==7.1.1",
  "qdrant-client==1.19.1",
  "fastembed==0.8.0",
]
eval = [
  "ragas==0.4.3",
  # ragas 0.4.3 imports langchain_community.chat_models.vertexai, which was
  # removed in langchain-community 0.4.x -> keep the 0.3 line.
  "langchain-community==0.3.31",
  "openai==3.14.1",
  "anthropic==1.6.0",
  "fastembed==0.8.0",
  "qdrant-client==1.19.1",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "fakeredis==2.38.0",
  "ruff==0.16.7",
  "mypy==2.3.1",
  "types-PyYAML==6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/rag_common/rag_common",
  "services/extraction_service/extraction_service",
  "services/contextual_chunking_service/contextual_chunking_service",
  "services/retrieval_service/retrieval_service",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services", "evaluation", "n8n"]
pythonpath = [
  "packages/rag_common",
  "services/extraction_service",
  "services/contextual_chunking_service",
  "services/retrieval_service",
  "evaluation",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:Api key is used with an insecure connection:UserWarning",
]
addopts = "-p no:cacheprovider --import-mode=importlib"
python_files = ["test_*.py", "tests_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["services/defuddle_sidecar", "n8n"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W", "N", "ASYNC", "RUF"]
ignore = ["RUF012", "B008"]  # B008: FastAPI `Depends()` defaults are the framework idiom

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"benchmarks/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["rag_common", "extraction_service", "contextual_chunking_service", "retrieval_service"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
mypy_path = "packages/rag_common:services/extraction_service:services/contextual_chunking_service:services/retrieval_service"
